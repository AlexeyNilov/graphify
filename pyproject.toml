[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grach"
version = "2.3.0"
description = "Build a corporate architecture graph from Markdown and OpenAPI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
    "types-PyYAML>=6",
]

[project.scripts]
grach = "grach.cli:main"

[tool.setuptools]
packages = ["grach"]

[tool.setuptools.package-data]
grach = ["static/*.html", "static/*.js", "static/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["grach", "tests"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
